server.port=${PORT:9080}
spring.application.name=api-gateway

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:9081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=users-service
spring.cloud.gateway.server.webflux.routes[1].uri=${USERS_SERVICE_URL:http://localhost:9082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/usuarios,/api/v1/usuarios/**

spring.cloud.gateway.server.webflux.routes[2].id=catalog-service
spring.cloud.gateway.server.webflux.routes[2].uri=${CATALOG_SERVICE_URL:http://localhost:9083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/productos,/api/v1/productos/**,/api/v1/categorias,/api/v1/categorias/**

spring.cloud.gateway.server.webflux.routes[3].id=order-service
spring.cloud.gateway.server.webflux.routes[3].uri=${ORDER_SERVICE_URL:http://localhost:9084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/boletas,/api/v1/boletas/**

jwt.secret=${JWT_SECRET}
jwt.issuer=nexus-game-auth

gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management.endpoints.web.exposure.include=health,info
