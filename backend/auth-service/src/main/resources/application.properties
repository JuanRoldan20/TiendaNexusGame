server.port=${PORT:9081}
spring.application.name=auth-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexus_auth?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:nexus_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.issuer=nexus-game-auth
jwt.expiration=${JWT_EXPIRATION:1h}

clients.users-service.url=${USERS_SERVICE_URL:http://localhost:9082}

auth.seed-users=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
