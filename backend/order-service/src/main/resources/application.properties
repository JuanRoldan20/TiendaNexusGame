server.port=${PORT:9084}
spring.application.name=order-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexus_orders?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:nexus_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

clients.catalog-service.url=${CATALOG_SERVICE_URL:http://localhost:9083}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
